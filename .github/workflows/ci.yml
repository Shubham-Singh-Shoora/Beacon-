name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec tsc --noEmit -p .github/scripts/tsconfig.json
      - run: pnpm lint
      - run: pnpm test
      - run: node --test .github/scripts/sync-auctions.test.mjs
      - run: pnpm --filter @hammerock/cca-sdk exec tsx --test ../../.github/scripts/sync-store.check.ts
      - run: pnpm bot:smoke
      # The published packages: sdk, widget and the cca-agent CLI.
      - run: pnpm build
      # The deployed Next app must compile too, not just the npm packages.
      - run: pnpm --filter @beacon/web build
