name: Sync auctions

# Keeps data/auctions.<chain>.json current. The directory reads these committed
# files, and a push to the default branch triggers a Vercel redeploy.
#
# Free endpoints by default (see packages/sdk/src/networks.ts). Optional repo
# secrets add a fallback per chain, e.g. BEACON_FALLBACK_RPC_URL_1.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Chains to sync (slugs, comma-separated)"
        default: "ethereum,base,unichain,arbitrum,sepolia"

permissions:
  contents: write

concurrency:
  group: sync-auctions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync
        env:
          BEACON_FALLBACK_RPC_URL_1: ${{ secrets.BEACON_FALLBACK_RPC_URL_1 }}
          BEACON_FALLBACK_RPC_URL_8453: ${{ secrets.BEACON_FALLBACK_RPC_URL_8453 }}
          BEACON_FALLBACK_RPC_URL_130: ${{ secrets.BEACON_FALLBACK_RPC_URL_130 }}
          BEACON_FALLBACK_RPC_URL_42161: ${{ secrets.BEACON_FALLBACK_RPC_URL_42161 }}
          BEACON_FALLBACK_RPC_URL_11155111: ${{ secrets.BEACON_FALLBACK_RPC_URL_11155111 }}
        # A failed chain does not stop the others; the step still fails so the
        # run shows red, and whatever did sync is committed below.
        run: pnpm sync:auctions -- --chain "${{ github.event.inputs.chains || 'ethereum,base,unichain,arbitrum,sepolia' }}"
        continue-on-error: true
        id: sync

      - name: Commit if auctions changed
        run: |
          # Did anything change besides the lastSyncedBlock watermark?
          changed=$(node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");
            const strip = (s) => { const j = JSON.parse(s); delete j.lastSyncedBlock; return JSON.stringify(j); };
            let changed = 0;
            for (const f of fs.readdirSync("data").filter((n) => /^auctions\..+\.json$/.test(n))) {
              let before = "";
              try { before = execSync(`git show HEAD:data/${f}`, { encoding: "utf8", maxBuffer: 1 << 26 }); } catch {}
              if (!before || strip(before) !== strip(fs.readFileSync(`data/${f}`, "utf8"))) changed = 1;
            }
            process.stdout.write(String(changed));
          ')
          # Watermarks alone are committed once a day, so the stored block keeps moving.
          if [ "$changed" != "1" ] && [ "$(date -u +%H%M)" -ge 0030 ]; then
            echo "Only watermarks moved - not committing."
            exit 0
          fi
          git config user.name "beacon-sync[bot]"
          git config user.email "beacon-sync[bot]@users.noreply.github.com"
          git add data/auctions.*.json
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "chore(data): sync auction stores"
          git push

      - name: Report sync failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more chains failed to sync - see the Sync step."
          exit 1
