name: Sync auctions

# Keeps data/auctions.<chain>.json current. The directory reads these committed
# files, and a push to the default branch triggers a Vercel redeploy.
#
# Free endpoints by default (see packages/sdk/src/networks.ts). Optional repo
# secrets add a fallback per chain, e.g. BEACON_FALLBACK_RPC_URL_1.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Chains to sync (slugs, comma-separated)"
        default: "ethereum,base,unichain,arbitrum,sepolia"

permissions:
  contents: write

concurrency:
  group: sync-auctions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync
        env:
          SYNC_CHAINS: ${{ inputs.chains || 'ethereum,base,unichain,arbitrum,sepolia' }}
          BEACON_RPC_URL_1: ${{ secrets.BEACON_RPC_URL_1 }}
          BEACON_RPC_URL_8453: ${{ secrets.BEACON_RPC_URL_8453 || 'https://base-rpc.publicnode.com' }}
          BEACON_RPC_URL_130: ${{ secrets.BEACON_RPC_URL_130 }}
          BEACON_RPC_URL_42161: ${{ secrets.BEACON_RPC_URL_42161 }}
          BEACON_RPC_URL_11155111: ${{ secrets.BEACON_RPC_URL_11155111 }}
          BEACON_LOGS_RPC_URL_1: ${{ secrets.BEACON_LOGS_RPC_URL_1 }}
          BEACON_LOGS_RPC_URL_8453: ${{ secrets.BEACON_LOGS_RPC_URL_8453 || 'https://base.gateway.tenderly.co' }}
          BEACON_SYNC_CHUNK_SIZE_8453: ${{ vars.BEACON_SYNC_CHUNK_SIZE_8453 || '500' }}
          BEACON_LOGS_RPC_URL_130: ${{ secrets.BEACON_LOGS_RPC_URL_130 }}
          BEACON_LOGS_RPC_URL_42161: ${{ secrets.BEACON_LOGS_RPC_URL_42161 }}
          BEACON_LOGS_RPC_URL_11155111: ${{ secrets.BEACON_LOGS_RPC_URL_11155111 }}
          BEACON_FALLBACK_RPC_URL_1: ${{ secrets.BEACON_FALLBACK_RPC_URL_1 }}
          BEACON_FALLBACK_RPC_URL_8453: ${{ secrets.BEACON_FALLBACK_RPC_URL_8453 || 'https://mainnet.base.org' }}
          BEACON_FALLBACK_RPC_URL_130: ${{ secrets.BEACON_FALLBACK_RPC_URL_130 }}
          BEACON_FALLBACK_RPC_URL_42161: ${{ secrets.BEACON_FALLBACK_RPC_URL_42161 }}
          BEACON_FALLBACK_RPC_URL_11155111: ${{ secrets.BEACON_FALLBACK_RPC_URL_11155111 }}
        # A failed chain does not stop the others; the step still fails so the
        # run shows red, and whatever did sync is committed below.
        run: node .github/scripts/sync-auctions.mjs
        continue-on-error: true
        id: sync

      - name: Commit if auctions changed
        run: |
          # Persist every successful checkpoint. Cron runs may be delayed beyond
          # midnight; a clock-window test can otherwise keep rescanning old blocks.
          git config user.name "beacon-sync[bot]"
          git config user.email "beacon-sync[bot]@users.noreply.github.com"
          git add data/auctions.*.json
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "chore(data): sync auction stores"
          # Rebase instead of overwriting a user commit that landed during sync.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report sync failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more chains failed to sync - see the Sync step."
          exit 1
